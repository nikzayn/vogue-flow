services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
    profiles: ["full"]   # `docker compose --profile full up` to run the API in Docker too
